<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Solenne</title>
<meta name="description" content="Visite en 3D d'une villa de luxe au Cap d'Antibes, de la porte d'entrée au garage, pilotée par le défilement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Plaquette immobilière haut de gamme : texte ivoire posé sur l'image 3D plein écran. */
:root{color-scheme:dark;--ivory:#f4efe6;--muted:rgba(244,239,230,.68);--line:rgba(244,239,230,.28);--gold:#d2b07a;--night:#0d0c0b;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--ivory);font-family:var(--sans);touch-action:none;-webkit-user-select:none;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45)),linear-gradient(transparent 62%,rgba(0,0,0,.5))}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.brand{font:500 15px var(--serif);letter-spacing:.42em;text-transform:uppercase}
.meta{font:400 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.room{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 48px));pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.55);transition:opacity .5s,transform .5s}
.room.swap{opacity:0;transform:translateY(10px)}
.room .idx{font:400 11px var(--sans);letter-spacing:.3em;color:var(--gold)}
.room h1{font:italic 400 clamp(40px,6.4vw,92px)/.95 var(--serif);margin:.15em 0 .2em;text-wrap:balance}
.room p{font:300 clamp(13px,1.1vw,16px)/1.6 var(--sans);color:var(--muted);max-width:46ch}
.plan{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:190px;height:150px;border:1px solid var(--line);background:rgba(13,12,11,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bar{position:fixed;left:0;right:0;bottom:0;height:calc(22px + env(safe-area-inset-bottom,0px));padding:0 max(24px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(24px,env(safe-area-inset-left,0px));display:flex;align-items:center}
.bar i{display:block;height:1px;width:100%;background:var(--line);position:relative}
.bar b{position:absolute;left:0;top:-.5px;height:2px;background:var(--gold);width:0}
.hint{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .8s}
.hint span{display:block;font:400 11px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--ivory);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.hint em{display:block;margin:14px auto 0;width:1px;height:46px;background:linear-gradient(var(--ivory),transparent);animation:drip 2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hint.off{opacity:0}
.end{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;width:min(560px,90vw);text-shadow:0 2px 20px rgba(0,0,0,.6)}
.end.on{opacity:1;pointer-events:auto}
.end h2{font:italic 400 clamp(44px,7vw,96px)/.95 var(--serif)}
.end p{font:300 14px/1.7 var(--sans);color:var(--muted);margin:16px 0 22px}
.end button{font:600 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--night);background:var(--ivory);border:0;padding:15px 26px;cursor:pointer}
.end button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);z-index:10;transition:opacity .9s}
.loader.done{opacity:0;pointer-events:none}
.loader div{text-align:center}
.loader b{display:block;font:500 22px var(--serif);letter-spacing:.42em;text-transform:uppercase}
.loader span{display:block;margin-top:14px;font:400 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){.plan{width:120px;height:96px;bottom:auto;top:calc(56px + env(safe-area-inset-top,0px))}.meta{display:none}.room{bottom:calc(40px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.hint em{animation:none}}
</style>

<canvas id="gl"></canvas>
<div class="vig"></div>
<header class="top"><div class="brand">Villa Solenne</div><div class="meta">Cap d'Antibes · 640 m² · 4 suites</div></header>
<div class="room" id="room"><div class="idx" id="rIdx">01 / 11</div><h1 id="rName">L'arrivée</h1><p id="rText"></p></div>
<canvas class="plan" id="plan" width="380" height="300" aria-label="Plan de la villa"></canvas>
<div class="bar"><i><b id="prog"></b></i></div>
<div class="hint" id="hint"><span>Faites défiler ou glissez pour entrer</span><em></em></div>
<div class="end" id="end"><h2>Villa Solenne</h2><p>Visites privées sur rendez-vous uniquement.<br>Prix sur demande.</p><button id="again">Recommencer la visite</button></div>
<div class="loader" id="loader"><div><b>Villa Solenne</b><span id="ldTxt">Préparation de la visite</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('ldTxt').textContent="La 3D n'a pas pu se charger. Rechargez la page.";return}
const isSmall=Math.min(innerWidth,innerHeight)<700;
const ld=document.getElementById('ldTxt');
setTimeout(build,60);

function build(){
/* ---------- Bruit procédural (textures sans image externe) ---------- */
let seed=1337;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const perm=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)perm[i]=p[i&255]}
const lerp=(a,b,t)=>a+(b-a)*t;
function vn(x,y,per){const X=Math.floor(x),Y=Math.floor(y),xf=x-X,yf=y-Y;const h=(i,j)=>perm[(perm[((X+i)%per+per)%per]+((Y+j)%per+per)%per)&255]/255;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(h(0,0),h(1,0),u),lerp(h(0,1),h(1,1),u),v)}
function fbm(x,y,per,o=5){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f,per*f);a*=.5;f*=2}return s}
function pix(size,fn){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const im=x.createImageData(size,size),d=im.data;for(let j=0;j<size;j++)for(let i=0;i<size;i++){const [r,g,b]=fn(i/size,j/size,i,j);const k=(j*size+i)*4;d[k]=r;d[k+1]=g;d[k+2]=b;d[k+3]=255}x.putImageData(im,0,0);return c}
function draw(size,fn){const c=document.createElement('canvas');c.width=c.height=size;fn(c.getContext('2d'),size);return c}
const maxAniso=8;
function T(canvas,rep=1,color=true){const t=new THREE.CanvasTexture(canvas);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);if(color)t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;return t}

const marble=(dark)=>pix(512,(u,v)=>{const w=fbm(u*2,v*2,2,4);const n=fbm(u*2+w*1.6,v*2+w*1.2,2,6),n2=fbm(u*3+5,v*3,3,5),fine=fbm(u*24,v*24,24,2);
 const r1=Math.abs(n-.5)*2,r2=Math.abs(n2-.5)*2;const vein=Math.pow(Math.max(0,1-r1*9),2.2)*.9+Math.pow(Math.max(0,1-r2*16),2)*.45;const cloud=fbm(u*5,v*5,5,4);
 if(dark){const b=14+cloud*16+fine*6,w2=vein*190;return[b+w2,b+w2,b+w2]}const b=244-cloud*18-fine*5,w2=vein*80;return[b-w2,b-w2*1.03,b-w2*1.08]});
const travertine=pix(512,(u,v,i,j)=>{const n=fbm(u*3,v*8,3),band=Math.sin((v*26+fbm(u*6,v*2,6)*3))*.5+.5,pore=fbm(u*64,v*64,64,2)>.72?-22:0;const joint=(i%256<2||j%256<2)?-28:0;const b=205+n*30-band*14+pore+joint;return[b+6,b-4,b-22]});
const plaster=pix(256,(u,v)=>{const n=fbm(u*8,v*8,8,4);const b=232+n*14;return[b+2,b,b-5]});
const grass=pix(512,(u,v)=>{const n=fbm(u*8,v*8,8),f=fbm(u*64,v*64,64,2);return[46+n*40+f*24,82+n*48+f*30,30+n*18]});
const fabric=pix(256,(u,v,i,j)=>{const n=fbm(u*16,v*16,16,3),w=((i+j)%4<2?6:-6)+((i-j)%6<3?3:-3);const b=200+n*20+w;return[b+10,b+2,b-10]});
const concrete=pix(512,(u,v)=>{const n=fbm(u*4,v*4,4),f=fbm(u*40,v*40,40,2);const b=150+n*36+f*16;return[b,b,b+2]});
const rock=pix(256,(u,v)=>{const n=fbm(u*6,v*10,6);return[110+n*70,96+n*60,78+n*46]});
const mosaic=draw(256,(x,s)=>{const n=16,c=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const r=rnd();x.fillStyle=`hsl(${186+r*14},${48+r*20}%,${52+r*14}%)`;x.fillRect(i*c,j*c,c,c)}x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1.5;for(let i=0;i<=n;i++){x.beginPath();x.moveTo(i*c,0);x.lineTo(i*c,s);x.moveTo(0,i*c);x.lineTo(s,i*c);x.stroke()}});
function woodCanvas(dark,vertical){return draw(1024,(x,s)=>{const rows=8,ph=s/rows;for(let r=0;r<rows;r++){let pos=-rnd()*s;while(pos<s){const L=s*(.35+rnd()*.5),hue=dark?22+rnd()*6:30+rnd()*6,l=dark?18+rnd()*7:52+rnd()*10;
 for(const off of[0,s]){x.fillStyle=`hsl(${hue},${dark?38:42}%,${l}%)`;x.fillRect(pos-off,r*ph,L,ph);x.save();x.beginPath();x.rect(pos-off,r*ph,L,ph);x.clip();
  for(let g=0;g<46;g++){const y0=r*ph+rnd()*ph,amp=1+rnd()*3,fr=.004+rnd()*.01;x.strokeStyle=`rgba(${dark?0:60},${dark?0:35},${dark?0:10},${.05+rnd()*.09})`;x.lineWidth=.6+rnd()*1.6;x.beginPath();for(let X=0;X<=L;X+=12)x.lineTo(pos-off+X,y0+Math.sin(X*fr+g)*amp);x.stroke()}x.restore();
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(pos-off,r*ph,1.5,ph)}
 pos+=L}x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,r*ph,s,1.5)}
 if(vertical){const c2=document.createElement('canvas');c2.width=c2.height=s;const y=c2.getContext('2d');y.translate(s/2,s/2);y.rotate(Math.PI/2);y.drawImage(x.canvas,-s/2,-s/2);x.drawImage(c2,0,0)}})}
const slats=draw(512,(x,s)=>{x.fillStyle='#2a1d14';x.fillRect(0,0,s,s);const n=16,w=s/n;for(let i=0;i<n;i++){x.fillStyle=`hsl(26,36%,${22+rnd()*8}%)`;x.fillRect(i*w+2,0,w-4,s);for(let g=0;g<14;g++){x.strokeStyle=`rgba(0,0,0,${.1+rnd()*.1})`;x.beginPath();const xx=i*w+3+rnd()*(w-6);x.moveTo(xx,0);x.bezierCurveTo(xx+3,s*.3,xx-3,s*.6,xx+1,s);x.stroke()}}});
const painting=draw(512,(x,s)=>{x.fillStyle='#e9e1d3';x.fillRect(0,0,s,s);const cols=['#c2734f','#2f3b44','#d9b37a','#8b9a8c','#1f1b18'];for(let k=0;k<9;k++){x.fillStyle=cols[k%cols.length];x.globalAlpha=.75;x.beginPath();const cx=rnd()*s,cy=rnd()*s,r=40+rnd()*150;x.ellipse(cx,cy,r,r*(.4+rnd()*.6),rnd()*3,0,7);x.fill()}x.globalAlpha=1;x.strokeStyle='#1f1b18';x.lineWidth=7;x.beginPath();x.moveTo(s*.12,s*.8);x.bezierCurveTo(s*.4,s*.2,s*.6,s*.95,s*.9,s*.25);x.stroke()});
const waterN=(()=>{const S=256,h=new Float32Array(S*S);for(let j=0;j<S;j++)for(let i=0;i<S;i++)h[j*S+i]=fbm(i/S*6,j/S*6,6,4);return pix(S,(u,v,i,j)=>{const a=h[j*S+((i+1)%S)]-h[j*S+((i-1+S)%S)],b=h[((j+1)%S)*S+i]-h[((j-1+S)%S)*S+i];return[128-a*400,128-b*400,255]})})();
ld.textContent='Construction de la villa';

/* ---------- Rendu ---------- */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,isSmall?1.5:1.75));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
renderer.physicallyCorrectLights=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,3000);
const SUN=new THREE.Vector3(-.5,.24,-.83).normalize();
const HORIZON=new THREE.Color('#f3c79a');
scene.fog=new THREE.Fog(HORIZON,140,1400);

const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN}},
 vertexShader:'varying vec3 vd;void main(){vd=normalize((modelMatrix*vec4(position,1.)).xyz-cameraPosition);gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}',
 fragmentShader:'uniform vec3 sun;varying vec3 vd;void main(){vec3 d=normalize(vd);float h=max(d.y,0.);vec3 zen=vec3(.30,.47,.74),mid=vec3(.86,.72,.62),hor=vec3(1.,.78,.55),low=vec3(.62,.55,.52);vec3 c=mix(hor,mid,smoothstep(0.,.18,h));c=mix(c,zen,smoothstep(.12,.7,h));c=mix(low,c,smoothstep(-.06,.0,d.y));float s=max(dot(d,sun),0.);c+=vec3(1.,.72,.42)*pow(s,8.)*.55+vec3(1.,.9,.7)*pow(s,900.)*8.;gl_FragColor=vec4(c,1.);}'});
const skyDome=()=>new THREE.Mesh(new THREE.SphereGeometry(1500,40,20),skyMat);
scene.add(skyDome());
const pmrem=new THREE.PMREMGenerator(renderer);
const roomEnv=pmrem.fromScene(new THREE.RoomEnvironment(),.04).texture;
const skyScene=new THREE.Scene();skyScene.add(skyDome());const g0=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshBasicMaterial({color:'#3d4f5e'}));g0.rotation.x=-Math.PI/2;g0.position.y=-30;skyScene.add(g0);
const skyEnv=pmrem.fromScene(skyScene,0,1,4000).texture;
scene.environment=roomEnv;

/* ---------- Matériaux ---------- */
const std=(o)=>new THREE.MeshStandardMaterial(o);
const tx={
 marbleW:T(marble(false)),marbleK:T(marble(true)),trav:T(travertine),plaster:T(plaster),grass:T(grass),fabric:T(fabric),concrete:T(concrete),rock:T(rock),mosaic:T(mosaic),
 oak:T(woodCanvas(false,false)),walnut:T(woodCanvas(true,true)),slats:T(slats),painting:T(painting),waterN:T(waterN,1,false)};
const M={
 plaster:std({map:tx.plaster,color:'#f2eee8',roughness:.93}),
 render:std({map:tx.plaster,color:'#f4f0ea',roughness:.9}),
 ceil:std({color:'#f3f0eb',roughness:.95}),
 trav:std({map:tx.trav,roughness:.55}),
 oak:std({map:tx.oak,roughness:.48}),
 nero:std({map:tx.marbleK,roughness:.12}),
 calacatta:std({map:tx.marbleW,roughness:.12}),
 concrete:std({map:tx.concrete,roughness:.32,color:'#d9d9d9'}),
 walnut:std({map:tx.walnut,roughness:.42}),
 slats:std({map:tx.slats,roughness:.6}),
 fabric:std({map:tx.fabric,color:'#efe6da',roughness:.96}),
 fabricDark:std({map:tx.fabric,color:'#6b6259',roughness:.96}),
 boucle:std({map:tx.fabric,color:'#fbf7f0',roughness:1}),
 linen:std({map:tx.fabric,color:'#ffffff',roughness:.98}),
 rug:std({map:tx.fabric,color:'#c9bba6',roughness:1}),
 brass:std({color:'#c9a46a',metalness:1,roughness:.28}),
 black:std({color:'#1b1a19',metalness:.5,roughness:.45}),
 bronze:std({color:'#3a332c',metalness:.8,roughness:.4}),
 chrome:std({color:'#e5e5e5',metalness:1,roughness:.08}),
 cabinet:std({color:'#2e3530',roughness:.55}),
 ceramic:std({color:'#f7f5f1',roughness:.15}),
 mirror:std({color:'#dcdcdc',metalness:1,roughness:.02,envMap:roomEnv}),
 glass:new THREE.MeshPhysicalMaterial({color:'#eef6f7',metalness:0,roughness:.02,transparent:true,opacity:.14,envMap:skyEnv,envMapIntensity:1.6,depthWrite:false,side:THREE.DoubleSide}),
 tinted:new THREE.MeshPhysicalMaterial({color:'#0f1418',metalness:.2,roughness:.05,clearcoat:1,envMap:skyEnv,envMapIntensity:1.4}),
 grass:std({map:tx.grass,roughness:1}),
 hedge:std({map:tx.grass,color:'#6f8f5c',roughness:1}),
 leaf:std({color:'#2f4527',roughness:.9}),
 olive:std({color:'#7d8b6a',roughness:.9}),
 olive2:std({color:'#5f6e50',roughness:.9}),
 bark:std({color:'#5a4a3c',roughness:1}),
 rock:std({map:tx.rock,roughness:1}),
 mosaic:std({map:tx.mosaic,roughness:.3}),
 water:new THREE.MeshPhysicalMaterial({color:'#5ec9d6',roughness:.04,metalness:0,transparent:true,opacity:.62,normalMap:tx.waterN,normalScale:new THREE.Vector2(.35,.35),envMap:skyEnv,envMapIntensity:1.2,depthWrite:false}),
 sea:std({color:'#1d4a66',roughness:.12,metalness:.1,envMap:skyEnv,envMapIntensity:1.3,normalMap:tx.waterN,normalScale:new THREE.Vector2(.25,.25)}),
 lamp:std({color:'#fff3df',emissive:'#ffd9a0',emissiveIntensity:2.4}),
 led:std({color:'#ffffff',emissive:'#fff1dc',emissiveIntensity:3}),
 art:std({map:tx.painting,roughness:.8}),
 teak:std({map:tx.walnut,color:'#c9a07a',roughness:.6}),
 fire:new THREE.MeshBasicMaterial({color:'#ff8a2a',transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}),
 rubber:std({color:'#151515',roughness:.85}),
 rim:std({color:'#9a9da3',metalness:1,roughness:.25}),
 head:std({color:'#ffffff',emissive:'#eaf4ff',emissiveIntensity:2}),
 tail:std({color:'#5a0000',emissive:'#ff1a1a',emissiveIntensity:1.6})
};
M.oak.map.repeat.set(1,1);

/* ---------- Aides de construction ---------- */
const sh=(m,c=true,r=true)=>{m.castShadow=c;m.receiveShadow=r;return m};
function put(geo,mat,x,y,z,parent=scene){const m=sh(new THREE.Mesh(geo,mat));m.position.set(x,y,z);parent.add(m);return m}
function box(w,h,d,mat,x,y,z,parent){return put(new THREE.BoxGeometry(w,h,d),mat,x,y+h/2,z,parent)}
function rbox(w,h,d,r,mat,x,y,z,parent){return put(new THREE.RoundedBoxGeometry(w,h,d,4,Math.min(r,w/2,h/2,d/2)),mat,x,y+h/2,z,parent)}
function cyl(rt,rb,h,mat,x,y,z,seg=32,parent){return put(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y+h/2,z,parent)}
function floor(x0,z0,x1,z1,mat,tile,y=.01){[x0,x1]=[Math.min(x0,x1),Math.max(x0,x1)];[z0,z1]=[Math.min(z0,z1),Math.max(z0,z1)];const w=x1-x0,d=z1-z0,g=new THREE.PlaneGeometry(w,d);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/tile,uv.getY(i)*d/tile);g.rotateX(-Math.PI/2);const m=put(g,mat,(x0+x1)/2,y,(z0+z1)/2);m.castShadow=false;return m}
const H=3.4,TH=.25,PLAN=[];

function wall(x0,z0,x1,z1,ops=[],mat=M.plaster,h=H){
